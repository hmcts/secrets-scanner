name: Secret Scanner
description: Scans the code base to detect for the presence of secrets.
inputs:
  github_token:
    required: true
    description: GitHub token for authentication, required for accessing the repository and posting comments.
  gitleaks_license:
    required: true
    description: Gitleaks license key to use the licensed version.
  gitleaks_regex_internal_url:
    required: false
    default: ""
    description: Regex to identify internal urls
  trufflehog_exclude_detectors:
    required: false
    default: ""
    description: >
      Comma-separated TruffleHog detectors to disable, e.g. "lob". Requires
      trufflehog_exclude_detectors_in - a detector cannot be disabled repository-wide,
      only within named paths. Affects TruffleHog only; gitleaks is unchanged. Accepts
      letters, digits, underscores, commas and hyphens only, so this input cannot be
      used to pass other arguments to the scanner.
  trufflehog_exclude_detectors_in:
    required: false
    default: ""
    description: >
      Where trufflehog_exclude_detectors applies, as one regex per line matching
      paths, e.g. "(^|/)tests?/". Everything outside these paths is still scanned by
      every detector, so a credential introduced in application code is still caught.
  trufflehog_allowlist:
    required: false
    default: ""
    description: >
      Path to a file retiring individual TruffleHog findings by fingerprint, one per
      line as "<64-hex fingerprint>  <reason>". Use this where a path-scoped detector
      exclusion cannot reach - most importantly a false positive in a commit message,
      which has no path. The fingerprint identifies one finding, so this cannot disable
      a detector or a directory; every entry must give a reason; and an entry that
      matches nothing is reported, because an unpruned allowlist becomes blindness.
      Unset by default, and the scan behaves exactly as before when unset.

runs:
  using: "composite"
  steps:
    - name: Prepare Gitleaks config
      if: ${{ inputs.gitleaks_regex_internal_url != '' }}
      shell: bash
      run: |
        echo "Executing step: Prepare Gitleaks config"
        set -euo pipefail
        export GITLEAKS_REGEX_INTERNAL_URL='${{ inputs.gitleaks_regex_internal_url }}'
        CUSTOM_CONFIG_FILE="$RUNNER_TEMP/gitleaks-custom-rules.toml"
        envsubst < "${{ github.action_path }}/gitleaks-custom-rules-template.toml" > "$CUSTOM_CONFIG_FILE"
        # Set GITLEAKS_CONFIG env variable and make it available to subsequent steps
        echo "GITLEAKS_CONFIG=$CUSTOM_CONFIG_FILE" >> "$GITHUB_ENV"
        echo "------------ Scan will run with builtin + custom rules ------------"

    - name: Gitleaks scanning
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITLEAKS_LICENSE: ${{ inputs.gitleaks_license }}
        GITLEAKS_ENABLE_COMMENTS: "false" # suppress PR comments
        GITLEAKS_ENABLE_SUMMARY:  "false" # suppress Job Summary

    - name: Compose TruffleHog arguments
      id: trufflehog_args
      shell: bash
      env:
        # Through the environment rather than interpolated into the script: a
        # workflow input reaching a shell directly is a command-injection seam,
        # and this action is a security control.
        EXCLUDE_DETECTORS: ${{ inputs.trufflehog_exclude_detectors }}
        EXCLUDE_DETECTORS_IN: ${{ inputs.trufflehog_exclude_detectors_in }}
      run: |
        set -euo pipefail
        base="--results=verified"

        # Each output key is written exactly once. Writing `scoped` twice and relying
        # on the later value winning is the kind of thing that behaves differently in
        # the runner than in a shell.
        if [ -z "$EXCLUDE_DETECTORS" ]; then
          if [ -n "$EXCLUDE_DETECTORS_IN" ]; then
            echo "::error::trufflehog_exclude_detectors_in was given without trufflehog_exclude_detectors, so it would do nothing. Remove it, or name the detectors to disable."
            exit 1
          fi
          {
            echo "scoped=false"
            echo "base_args=$base"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Detector names only. Without this check a caller could append arbitrary
        # flags - --no-verification, or --results=all - and weaken the scan through
        # an input that reads like a narrow one.
        if ! printf '%s' "$EXCLUDE_DETECTORS" | grep -Eq '^[A-Za-z0-9_,-]+$'; then
          echo "::error::trufflehog_exclude_detectors must be a comma-separated list of detector names (letters, digits, underscores, hyphens). Refusing to run rather than passing it through."
          exit 1
        fi

        # A detector cannot be turned off repository-wide. Disabling one everywhere
        # means a credential introduced later in application code goes unreported,
        # and nothing in the run says so. Naming the paths keeps the dismissal where
        # the false positive is - usually test fixtures - and leaves the rest of the
        # tree scanned by everything.
        if [ -z "$EXCLUDE_DETECTORS_IN" ]; then
          echo "::error::trufflehog_exclude_detectors requires trufflehog_exclude_detectors_in. A detector can be disabled within named paths, not repository-wide: set trufflehog_exclude_detectors_in to the paths the false positive lives in, for example '(^|/)tests?/'."
          exit 1
        fi

        scope="$GITHUB_WORKSPACE/.trufflehog-exclusion-scope"
        printf '%s\n' "$EXCLUDE_DETECTORS_IN" > "$scope"
        echo "----- detector exclusion is scoped to these paths -----"
        cat "$scope"
        echo "::notice::TruffleHog detectors $EXCLUDE_DETECTORS are disabled only within the paths listed in .trufflehog-exclusion-scope; the rest of the tree is scanned by every detector."
        {
          echo "scoped=true"
          echo "outside_args=$base --exclude-paths=.trufflehog-exclusion-scope"
          echo "inside_args=$base --include-paths=.trufflehog-exclusion-scope --exclude-detectors=$EXCLUDE_DETECTORS"
        } >> "$GITHUB_OUTPUT"

    # Without an allowlist the upstream action runs as it always has, and decides
    # pass or fail itself. That is the path almost every caller takes, so it is
    # left exactly as it was.

    # One run when nothing is excluded - the original behaviour, unchanged.
    - name: TruffleHog 🐽 scanning
      if: ${{ steps.trufflehog_args.outputs.scoped != 'true' && inputs.trufflehog_allowlist == '' }}
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: ${{ steps.trufflehog_args.outputs.base_args }}

    # Two runs when a detector is excluded within named paths, so the exclusion
    # cannot reach the rest of the tree. Both steps fail the job on a finding.
    - name: TruffleHog 🐽 scanning (outside the exclusion scope, all detectors)
      if: ${{ steps.trufflehog_args.outputs.scoped == 'true' && inputs.trufflehog_allowlist == '' }}
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: ${{ steps.trufflehog_args.outputs.outside_args }}

    - name: TruffleHog 🐽 scanning (inside the exclusion scope)
      if: ${{ steps.trufflehog_args.outputs.scoped == 'true' && inputs.trufflehog_allowlist == '' }}
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: ${{ steps.trufflehog_args.outputs.inside_args }}

    # With an allowlist the scan has to be run here rather than delegated, because
    # the upstream action fails the step on any finding and exposes no results to
    # inspect - there is nowhere to apply a per-finding decision. Same image, same
    # arguments; the only differences are --json, and that the verdict is made by
    # the filter instead of by exit code alone.
    - name: TruffleHog 🐽 scanning (allowlist applied per finding)
      if: ${{ inputs.trufflehog_allowlist != '' }}
      shell: bash
      env:
        # Through the environment, not interpolated: see the note above.
        ALLOWLIST: ${{ inputs.trufflehog_allowlist }}
        SCOPED: ${{ steps.trufflehog_args.outputs.scoped }}
        BASE_ARGS: ${{ steps.trufflehog_args.outputs.base_args }}
        OUTSIDE_ARGS: ${{ steps.trufflehog_args.outputs.outside_args }}
        INSIDE_ARGS: ${{ steps.trufflehog_args.outputs.inside_args }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # A path, not a shell fragment. Refuse rather than pass it through.
        if ! printf '%s' "$ALLOWLIST" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
          echo "::error::trufflehog_allowlist must be a plain relative path (letters, digits, dot, underscore, hyphen, slash). Refusing to run rather than passing it through."
          exit 1
        fi
        case "$ALLOWLIST" in
          /*|*..*) echo "::error::trufflehog_allowlist must be a relative path inside the repository, with no '..' segments."; exit 1 ;;
        esac
        if [ ! -f "$GITHUB_WORKSPACE/$ALLOWLIST" ]; then
          echo "::error::trufflehog_allowlist names $ALLOWLIST, which is not a file in this repository."
          exit 1
        fi

        image="ghcr.io/trufflesecurity/trufflehog:latest"
        docker pull -q "$image"

        findings="$RUNNER_TEMP/trufflehog-findings.json"
        : > "$findings"

        scan() {
          # --no-fail because the verdict belongs to the filter: a finding that is
          # allowlisted must not fail the job, and exit code alone cannot say which.
          # shellcheck disable=SC2086
          docker run --rm -v "$GITHUB_WORKSPACE:/pwd" -w /pwd "$image" \
            git file:///pwd $1 --json --no-fail >> "$findings"
        }

        if [ "$SCOPED" = "true" ]; then
          scan "$OUTSIDE_ARGS"
          scan "$INSIDE_ARGS"
        else
          scan "$BASE_ARGS"
        fi

        python3 "$ACTION_PATH/scripts/filter-allowlisted-findings.py" \
          --allowlist "$GITHUB_WORKSPACE/$ALLOWLIST" < "$findings"
