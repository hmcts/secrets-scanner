name: Secret Scanner
description: Scans the code base to detect for the presence of secrets.
inputs:
  github_token:
    required: true
    description: GitHub token for authentication, required for accessing the repository and posting comments.
  gitleaks_license:
    required: true
    description: Gitleaks license key to use the licensed version.
  run_hmcts_rules:
    required: false
    default: false
    description: Whether to run with HMCTS custom rules
  hmcts_regex_internal_urls:
    required: false
    default: ""
    description: Regex to identify hmcts internal urls (mandatory when run_hmcts_rules is true)
  hmcts_regex_system_ids:
    required: false
    default: ""
    description: Regex to identify hmcts system ids (mandatory when run_hmcts_rules is true)
  test_mode:
    required: false
    default: "false"
    description: Enable test mode to run gitleaks via Docker on test_workspace (for integration tests only)

runs:
  using: "composite"
  steps:
    - name: Validate HMCTS rules inputs
      if: ${{ inputs.run_hmcts_rules == 'true' }}
      shell: bash
      run: |
        echo "Executing step: Validate HMCTS rules inputs"
        set -euo pipefail

        RAW_REGEX_1='${{ inputs.hmcts_regex_internal_urls }}'
        RAW_REGEX_2='${{ inputs.hmcts_regex_system_ids }}'
        REGEX_1="${RAW_REGEX_1//[[:space:]]/}"
        REGEX_2="${RAW_REGEX_2//[[:space:]]/}"
        if [ -z "$REGEX_1" ] || [ -z "$REGEX_2" ]; then
          echo "::error title=Missing value::When run_hmcts_rules is true, hmcts_regex_internal_urls/hmcts_regex_system_ids must be provided and not empty"
          exit 1
        fi

        echo "HMCTS rules inputs validation passed"

    - name: Generate custom Gitleaks config with HMCTS rules
      if: ${{ inputs.run_hmcts_rules == 'true' }}
      shell: bash
      run: |
        echo "Executing step: Generate custom Gitleaks config"
        set -euo pipefail

        export HMCTS_REGEX_INTERNAL_URLS='${{ inputs.hmcts_regex_internal_urls }}'
        export HMCTS_REGEX_SYSTEM_IDS='${{ inputs.hmcts_regex_system_ids }}'
        CUSTOM_CONFIG_FILE="$RUNNER_TEMP/gitleaks-hmcts-rules.toml"
        envsubst < "${{ github.action_path }}/gitleaks-hmcts-rules-template.toml" > "$CUSTOM_CONFIG_FILE"

        # Let gitleaks pick up the generated config
        echo "GITLEAKS_CONFIG=$CUSTOM_CONFIG_FILE" >> "$GITHUB_ENV"
        echo "------------ Scan will run with builtin + custom rules ------------"

    - name: Gitleaks scanning (production)
      if: ${{ inputs.test_mode != 'true' }}
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITLEAKS_LICENSE: ${{ inputs.gitleaks_license }}
        GITLEAKS_ENABLE_COMMENTS: "false"
        GITLEAKS_ENABLE_SUMMARY: "false"

    - name: Gitleaks scanning (test mode)
      if: ${{ inputs.test_mode == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        ENV_CONFIG_OPT=""
        if [ -n "${GITLEAKS_CONFIG:-}" ]; then
          ENV_CONFIG_OPT="-e GITLEAKS_CONFIG=${GITLEAKS_CONFIG}"
        fi
        docker run --rm \
          -v "${{ github.workspace }}:/repo" \
          -v "$RUNNER_TEMP:$RUNNER_TEMP" \
          -e GITLEAKS_LICENSE="${{ inputs.gitleaks_license }}" \
          ${ENV_CONFIG_OPT} \
          zricethezav/gitleaks:latest \
          detect \
          --source "/repo/test_workspace" \
          --report-format json \
          --report-path "/repo/test_workspace/gitleaks-report.json" \
          --redact -v \
          --exit-code 0

    - name: TruffleHog 🐽 scanning
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --results=verified
